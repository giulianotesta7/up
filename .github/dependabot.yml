version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-modules:
        patterns: ['*']
