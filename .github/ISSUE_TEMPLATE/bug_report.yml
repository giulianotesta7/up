name: Bug report
description: Something in up behaves incorrectly.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the incorrect behavior. Include the exact error or TUI message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `up serve --api-listen :8080`
        2. Open `up tui --remote` and press `n`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag you installed, or the commit if you built from source.
      placeholder: v0.7.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Binary (install.sh)
        - systemd user service (--service)
        - systemd system service (--system)
        - Docker
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: tui-mode
    attributes:
      label: TUI mode
      options:
        - Local (up tui)
        - Remote (up tui --remote)
        - Not TUI related
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `up serve` output. Remove tokens, passwords, header values and webhook URLs first.
      render: text
