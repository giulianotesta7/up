name: Documentation
description: Missing, wrong or unclear documentation.
title: "docs: "
labels: [documentation]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: File and section, for example README.md › Maintenance windows.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
