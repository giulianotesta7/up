name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$RELEASE_TAG.md"
          if ! python3 -c 'import pathlib, sys; notes = pathlib.Path(sys.argv[1]); sys.exit(0 if notes.is_file() and notes.read_text(encoding="utf-8").strip() else 1)' "$notes"; then
            echo "::error::Release notes must exist and contain non-whitespace text: $notes" >&2
            exit 1
          fi

      - name: Test release workflow
        run: python3 .github/tests/test_release_workflow.py

      - name: Test
        run: go test ./... -count=1 -timeout 10m

      - name: Build release files
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            mkdir "dist/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/$arch/up" ./cmd/up
            tar -czf "dist/up_linux_${arch}.tar.gz" -C "dist/$arch" up
          done
          cp deploy/up.service dist/up.service
          cp deploy/up-system.service dist/up-system.service
          (cd dist && sha256sum up_linux_*.tar.gz > checksums.txt)

      - name: Container tags
        id: container-tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/giulianotesta7/up"
          image_tag=$(printf '%s' "$RELEASE_TAG" | LC_ALL=C sed 's/[^a-zA-Z0-9_.-]/-/g' | cut -c1-128)
          {
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image" "$image_tag"
            if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              printf '%s:latest\n' "$image"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container-tags.outputs.tags }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" \
            dist/up_linux_amd64.tar.gz dist/up_linux_arm64.tar.gz dist/checksums.txt dist/up.service dist/up-system.service \
            --title "$RELEASE_TAG" --notes-file "$notes" --verify-tag
