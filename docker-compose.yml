# HTTP API on port 8080. HTTPS is recommended via a reverse proxy or
# mounted certificates configured with UP_TLS_CERT and UP_TLS_KEY.
services:
  up:
    image: ghcr.io/heohlee/up:latest
    restart: unless-stopped
    environment:
      UP_API_LISTEN: ":8080"
    ports:
      - "8080:8080"
    volumes:
      # Database, encryption key and API token hash.
      - up-data:/data

volumes:
  up-data:
